name: Felhő — Magyar üzleti infrastruktúra
description: >-
  Hungarian business-infrastructure platform offering company information (registry data, financials, officers/owners,
  TEÁOR'25 activity codes), business verification and risk scoring, address/tax-number and bank routing lookups, and
  domain/WHOIS-RDAP tools. Provides an authenticated REST/JSON API and agent-native llms.txt artifacts. Operated by
  Verde Holding Kft.; data is drawn from the public Hungarian company register, published financial statements and the
  NAV VAT registry. Missing data is returned as null, never estimated.
